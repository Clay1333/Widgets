<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TradingView Chart Widget</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #131722;
    }

    #tradingview-widget-container {
      width: 100%;
      height: 100vh;
    }

    #tradingview-widget-container .tradingview-widget-copyright {
      font-size: 11px;
      line-height: 14px;
      text-align: center;
      color: #9db2bd;
      padding: 4px 0;
    }

    #tradingview-widget-container .tradingview-widget-copyright a {
      color: #9db2bd;
      text-decoration: none;
    }

    #tradingview-widget-container .tradingview-widget-copyright a:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>
  <!-- TradingView Advanced Chart Widget -->
  <div id="tradingview-widget-container">
    <div id="tradingview-widget"></div>
    <div class="tradingview-widget-copyright">
      <a href="https://www.tradingview.com/" rel="noopener nofollow" target="_blank">
        Track all markets on TradingView
      </a>
    </div>
  </div>

  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <script type="text/javascript">
    new TradingView.widget({
      "autosize": true,
      "symbol": "NASDAQ:AAPL",
      "interval": "D",
      "timezone": "Etc/UTC",
      "theme": "dark",
      "style": "1",
      "locale": "en",
      "toolbar_bg": "#1e222d",
      "enable_publishing": false,
      "allow_symbol_change": true,
      "container_id": "tradingview-widget"
    });
  </script>
</body>
</html>
