<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TradingView Watchlist Widget</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #131722;
    }

    .tradingview-widget-container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .tradingview-widget-container__widget {
      flex: 1;
    }

    .tradingview-widget-copyright {
      font-size: 11px;
      line-height: 14px;
      text-align: center;
      color: #9db2bd;
      padding: 4px 0;
    }

    .tradingview-widget-copyright a {
      color: #9db2bd;
      text-decoration: none;
    }

    .tradingview-widget-copyright a:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>
  <!-- TradingView Market Overview (Watchlist) Widget.
       NOTE: TradingView's external embed script reads its configuration from the
       textContent of the <script> tag that loads it (via document.currentScript).
       Placing JSON inside the async <script src="..."> tag is the documented and
       required pattern for this widget. -->
  <div class="tradingview-widget-container">
    <div class="tradingview-widget-container__widget"></div>
    <div class="tradingview-widget-copyright">
      <a href="https://www.tradingview.com/" rel="noopener nofollow" target="_blank">
        Track all markets on TradingView
      </a>
    </div>
  </div>

  <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
  {
    "colorTheme": "dark",
    "dateRange": "12M",
    "showChart": true,
    "locale": "en",
    "isTransparent": false,
    "showSymbolLogo": true,
    "showFloatingTooltip": false,
    "width": "100%",
    "height": "100%",
    "tabs": [
      {
        "title": "Indices",
        "symbols": [
          {"s": "FOREXCOM:SPXUSD", "d": "S&P 500"},
          {"s": "FOREXCOM:NSXUSD", "d": "US 100"},
          {"s": "FOREXCOM:DJI",    "d": "Dow Jones"},
          {"s": "INDEX:NKY",       "d": "Nikkei 225"},
          {"s": "INDEX:DEU40",     "d": "DAX"},
          {"s": "FOREXCOM:UKXGBP", "d": "FTSE 100"}
        ],
        "originalTitle": "Indices"
      },
      {
        "title": "Futures",
        "symbols": [
          {"s": "CME_MINI:ES1!", "d": "S&P 500 Futures"},
          {"s": "COMEX:GC1!",    "d": "Gold"},
          {"s": "NYMEX:CL1!",    "d": "WTI Crude Oil"},
          {"s": "NYMEX:NG1!",    "d": "Natural Gas"},
          {"s": "CBOT:ZC1!",     "d": "Corn"},
          {"s": "CBOT:ZW1!",     "d": "Wheat"}
        ],
        "originalTitle": "Futures"
      },
      {
        "title": "Crypto",
        "symbols": [
          {"s": "BINANCE:BTCUSDT",  "d": "Bitcoin"},
          {"s": "BINANCE:ETHUSDT",  "d": "Ethereum"},
          {"s": "BINANCE:SOLUSDT",  "d": "Solana"},
          {"s": "BINANCE:BNBUSDT",  "d": "BNB"},
          {"s": "BINANCE:XRPUSDT",  "d": "XRP"},
          {"s": "BINANCE:ADAUSDT",  "d": "Cardano"}
        ],
        "originalTitle": "Crypto"
      },
      {
        "title": "Forex",
        "symbols": [
          {"s": "FX:EURUSD", "d": "EUR / USD"},
          {"s": "FX:GBPUSD", "d": "GBP / USD"},
          {"s": "FX:USDJPY", "d": "USD / JPY"},
          {"s": "FX:USDCHF", "d": "USD / CHF"},
          {"s": "FX:AUDUSD", "d": "AUD / USD"},
          {"s": "FX:USDCAD", "d": "USD / CAD"}
        ],
        "originalTitle": "Forex"
      }
    ]
  }
  </script>
</body>
</html>
